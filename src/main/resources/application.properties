spring.application.name=chamados-service

# Porta 8081 para não conflitar com o ThinDesk (login), que roda na 8080
server.port=8081

# MongoDB Atlas - a string de conexão vem da variável de ambiente MONGODB_URI
# Exemplo: mongodb+srv://usuario:senha@cluster0.xxxxx.mongodb.net/?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk_chamados}
spring.data.mongodb.auto-index-creation=true

# Datas no formato ISO (ex.: 2026-10-23T10:15:30)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
